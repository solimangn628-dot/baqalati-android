name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          mkdir -p "$ANDROID_HOME/licenses"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract and fix resources
        run: |
          mkdir -p source
          unzip -q "محاسبة_بقالتي_Android_احترافي.zip" -d source
          PROJ="source/محاسبة_بقالتي_Android"
          RES="$PROJ/app/src/main/res"
          mkdir -p "$RES/values"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="brand_dark_green">#0B3D2E</color>\n</resources>\n' > "$RES/values/colors.xml"
          for f in "$RES/drawable/splash_background.xml" "$RES/mipmap-anydpi-v26/ic_launcher.xml"; do
            if [ -f "$f" ]; then
              sed -i 's/#0B3D2E/@color\/brand_dark_green/g' "$f"
            fi
          done

      - name: Build APK
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          cd "source/محاسبة_بقالتي_Android"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baqalati-apk
          path: source/محاسبة_بقالتي_Android/app/build/outputs/apk/debug/app-debug.apk
